<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VKSND Khu vực 9 - An Giang | Trang tổng hợp</title>
<style>
  :root{
    --bg:#e7e9ec;
    --bg-top:#f7f8f9;
    --surface:#f2f4f6;
    --surface-white:#ffffff;
    --text:#3f4650;
    --text-muted:#8b929b;
    --accent-cyan:#00c7e8;
    --accent-blue:#0088f5;
    --accent-deep:#006fe6;
    --accent-shadow:rgba(0,136,245,.28);
    --shadow-dark:8px 10px 22px rgba(120,128,140,.24);
    --shadow-light:-8px -8px 20px rgba(255,255,255,.92);
    --shadow-in-dark:inset 5px 5px 12px rgba(130,137,147,.18);
    --shadow-in-light:inset -5px -5px 12px rgba(255,255,255,.95);
    --border-soft:rgba(255,255,255,.78);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 38%),
      linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 100%);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:12px 20px 42px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    width:min(100%,1040px);
    margin:0 auto;
  }

  header{
    text-align:center;
    margin-bottom:34px;
  }

  .logo-wrap{
    position:relative;
    width:150px;
    height:150px;
    margin:0 auto 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:0;
    box-shadow:none;
    border-radius:0;
  }

  .logo-img{
    position:relative;
    z-index:2;
    width:94px;
    height:auto;
    filter:drop-shadow(0 7px 13px rgba(80,85,95,.22));
    animation:logoFloat 4.5s ease-in-out infinite;
  }

  @keyframes logoFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }


  h1{
    font-size:clamp(1.15rem,2.8vw,1.65rem);
    font-weight:800;
    margin:0 0 10px;
    letter-spacing:.035em;
    text-transform:uppercase;
    line-height:1.38;
    color:#3d444e;
    text-shadow:0 1px 0 rgba(255,255,255,.85);
  }

  header p{
    color:var(--text-muted);
    font-size:.94rem;
    margin:0;
    line-height:1.55;
    letter-spacing:.01em;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:26px;
  }

  @media (min-width:680px){
    .grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
  }

  @media (min-width:940px){
    .grid{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }
  }

  a.card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:245px;
    padding:27px 27px 24px;
    overflow:hidden;
    background:linear-gradient(145deg,#f7f8fa 0%,#eceef1 100%);
    border:1px solid var(--border-soft);
    border-radius:24px;
    text-decoration:none;
    color:var(--text);
    box-shadow:var(--shadow-dark),var(--shadow-light);
    transition:
      transform .28s cubic-bezier(.22,1,.36,1),
      box-shadow .28s ease,
      border-color .28s ease;
    will-change:transform;
  }

  a.card::before{
    content:"";
    position:absolute;
    top:0;
    left:18px;
    right:18px;
    height:1px;
    background:rgba(255,255,255,.95);
    opacity:.95;
  }

  a.card::after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    right:-58px;
    top:-58px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(0,199,232,.12),rgba(0,199,232,0) 68%);
    pointer-events:none;
  }

  a.card:hover,
  a.card:focus-visible{
    outline:none;
    border-color:rgba(0,168,230,.24);
    box-shadow:
      0 18px 32px rgba(100,110,122,.22),
      -8px -8px 20px rgba(255,255,255,.95),
      0 0 0 1px rgba(0,160,230,.06);
  }

  .icon-circle{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:58px;
    height:58px;
    margin-bottom:7px;
    border-radius:18px;
    background:linear-gradient(145deg,var(--accent-cyan),var(--accent-blue));
    box-shadow:
      6px 7px 14px rgba(0,120,220,.22),
      inset 2px 2px 4px rgba(255,255,255,.22);
    font-size:1.42rem;
    color:#fff;
  }

  .card .title{
    font-weight:750;
    font-size:1.02rem;
    line-height:1.4;
    color:#424a55;
  }

  .card .desc{
    color:var(--text-muted);
    font-size:.87rem;
    line-height:1.58;
    max-width:40em;
  }

  .go{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-top:auto;
    align-self:flex-start;
    min-height:38px;
    padding:8px 17px;
    border-radius:999px;
    color:#fff;
    font-size:.82rem;
    font-weight:750;
    letter-spacing:.01em;
    background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue));
    box-shadow:
      0 8px 16px -5px var(--accent-shadow),
      inset 1px 1px 2px rgba(255,255,255,.25);
    transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
  }

  /* Nút xanh có 2 trạng thái: nổi bình thường, chìm khi nhấn */
  .go::after{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    box-shadow:0 0 8px rgba(255,255,255,.35);
  }

  .go:active,
  a.card:active .go{
    transform:translateY(2px) scale(.985);
    box-shadow:
      inset 4px 5px 9px rgba(0,71,145,.38),
      inset -2px -2px 5px rgba(255,255,255,.20);
    filter:saturate(.98);
  }

  a.card:hover .go{
    transform:translateY(-1px);
    box-shadow:
      0 11px 20px -5px rgba(0,136,245,.34),
      inset 1px 1px 2px rgba(255,255,255,.3);
    filter:saturate(1.05);
  }

  .icon-circle{
    transition:transform .2s ease, box-shadow .2s ease;
  }

  a.card:active .icon-circle{
    transform:translateY(2px) scale(.96);
    box-shadow:
      inset 5px 6px 10px rgba(0,74,145,.38),
      inset -2px -2px 5px rgba(255,255,255,.20);
  }

  /* Gợn sóng khi bấm vào nút */
  .click-ripple{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    pointer-events:none;
    background:rgba(255,255,255,.28);
    box-shadow:0 0 0 1px rgba(255,255,255,.16);
    transform:translate(-50%,-50%) scale(0);
    animation:clickRipple .65s ease-out forwards;
  }

  @keyframes clickRipple{
    to{
      transform:translate(-50%,-50%) scale(7);
      opacity:0;
    }
  }

  .empty-hint{
    grid-column:1/-1;
    text-align:center;
    color:var(--text-muted);
    font-size:.85rem;
    padding:32px;
    border-radius:24px;
    background:linear-gradient(145deg,#f7f8fa,#eceef1);
    border:1px solid var(--border-soft);
    box-shadow:var(--shadow-in-dark),var(--shadow-in-light);
  }

  footer{
    text-align:center;
    margin-top:48px;
    padding-top:18px;
    color:#9aa0a8;
    font-size:.78rem;
    letter-spacing:.02em;
  }

  .reveal{
    opacity:0;
    transform:translateY(18px);
  }

  .reveal.visible{
    opacity:1;
    transform:translateY(0);
    transition:
      opacity .65s cubic-bezier(.16,.8,.24,1),
      transform .65s cubic-bezier(.16,.8,.24,1);
  }

  @media (max-width:679px){
    body{padding:9px 16px 30px;}
    header{margin-bottom:26px;}
    .logo-wrap{width:132px;height:132px;}
    .logo-img{width:86px;}
    a.card{min-height:225px;padding:23px 22px 21px;}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .reveal{opacity:1;transform:none;}
    .logo-img{animation:none;}
    a.card{transition:none;}
    .go{transition:none;}
  }

  /* Nền hạt ánh sáng chuyển động phía sau toàn trang */
  #bgParticles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-1;
    pointer-events:none;
    display:block;
  }

  /* Header và lưới liên kết dịch chuyển parallax nhẹ khi cuộn trang */
  header, .grid{
    will-change:transform;
  }

  /* Cá vàng đuôi xẻ ba bơi qua bơi lại (trang trí) */
  .swim-fish-wrap{
    position:fixed;
    top:50%;
    left:0;
    z-index:5;
    pointer-events:none;
    opacity:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));
    will-change:transform;
  }

  #swimFish1{top:40%;}
  #swimFish2{top:60%;}
  #swimFish3{top:75%;}

  .fish-tail{
    transform-origin:20px 15px;
    animation:tailWag .55s ease-in-out infinite;
  }

  @keyframes tailWag{
    0%,100%{transform:rotate(-16deg);}
    50%{transform:rotate(16deg);}
  }

</style>
</head>

<script>
  // Danh sách liên kết — thêm trang mới bằng cách thêm 1 object vào mảng bên dưới.
  const links = [
    {
      icon: "🗄️",
      title: "Hệ thống quản lý, tra cứu, mượn hồ sơ lưu trữ",
      desc: "Kho lưu trữ dữ liệu, tài liệu điện tử của đơn vị.",
      url: "https://vksndkv9-ag.github.io/Luu-tru/"
    },
    {
      icon: "📱",
      title: "Khai báo tài khoản mạng xã hội",
      desc: "Đăng ký, khai báo tài khoản MXH và trang web cá nhân.",
      url: "https://vksndkv9-ag.github.io/khai-bao-tai-khoan-MXH/"
    },
    {
      icon: "🗳️",
      title: "Hệ thống bình chọn điện tử",
      desc: "Tham gia bình chọn, đánh giá trực tuyến của đơn vị.",
      url: "https://vksndkv9-ag.github.io/bo-phieu-dien-tu/"
    },
    {
      icon: "⚖️",
      title: "Tiếp nhận thông tin khởi kiện công ích",
      desc: "Gửi thông tin, phản ánh liên quan đến khởi kiện vì lợi ích công cộng.",
      url: "https://vksndkv9-ag.github.io/Loi-ich-cong/"
    }
    // Thêm trang mới tại đây, ví dụ:
    // { icon: "📄", title: "Tên trang mới", desc: "Mô tả ngắn.", url: "https://vksndkv9-ag.github.io/ten-trang-moi/" }
  ];

  const grid = document.getElementById("grid");
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Hiệu ứng nghiêng 3D theo con trỏ chuột (tilt effect)
  function addTilt(el){
    if (prefersReducedMotion) return;
    const strength = 7;
    el.addEventListener("mouseenter", () => {
      el.style.transition = "transform .12s ease-out, box-shadow .18s ease";
    });
    el.addEventListener("mousemove", (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      el.style.transform =
        `perspective(700px) rotateX(${(-y * strength).toFixed(2)}deg) rotateY(${(x * strength).toFixed(2)}deg) translateY(-4px) scale(1.015)`;
    });
    el.addEventListener("mouseleave", () => {
      el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1), box-shadow .18s ease";
      el.style.transform = "";
    });
  }

  if (links.length === 0) {
    grid.innerHTML = '<div class="empty-hint">Chưa có liên kết nào.</div>';
  } else {
    links.forEach(item => {
      const a = document.createElement("a");
      a.className = "card reveal";
      a.href = item.url;
      a.innerHTML = `
        <span class="icon-circle">${item.icon || "🔗"}</span>
        <span class="title">${item.title}</span>
        <span class="desc">${item.desc || ""}</span>
        <span class="go">Truy cập →</span>
      `;
      addTilt(a);
      grid.appendChild(a);
    });
  }

  // Hiệu ứng gợn sóng khi bấm nút/card
  document.querySelectorAll("a.card").forEach(card => {
    card.addEventListener("pointerdown", (e) => {
      const ripple = document.createElement("span");
      ripple.className = "click-ripple";
      const rect = card.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left) + "px";
      ripple.style.top = (e.clientY - rect.top) + "px";
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    });
  });

  // Hiệu ứng xuất hiện tuần tự (staggered reveal) khi tải trang
  requestAnimationFrame(() => {
    document.querySelectorAll(".reveal").forEach((el, i) => {
      setTimeout(() => el.classList.add("visible"), 100 + i * 90);
    });
  });
</script>

<script>
  // ===== Hiệu ứng toàn trang: sóng nước làm nền + parallax khi cuộn =====
  (function pageWideEffects(){
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---- Sóng nước lan tỏa nhẹ làm nền cho toàn bộ trang ----
    const bg = document.getElementById("bgParticles");
    const bgCtx = bg.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let ripples = [];
    let lastSpawn = -10;

    function sizeBg(){
      bg.width = window.innerWidth * dpr;
      bg.height = window.innerHeight * dpr;
      bg.style.width = window.innerWidth + "px";
      bg.style.height = window.innerHeight + "px";
      bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawWaves(now){
      const t = now / 1000;
      const w = window.innerWidth;
      const h = window.innerHeight;
      bgCtx.clearRect(0, 0, w, h);

      // Các dải sóng nước mềm chạy ngang khắp trang.
      const waveLines = 6;
      for(let i = 0; i < waveLines; i++){
        const baseY = (h * (i + 1)) / (waveLines + 1);
        bgCtx.beginPath();
        for(let x = -20; x <= w + 20; x += 6){
          const y =
            baseY +
            Math.sin(x * 0.012 + t * 0.6 + i * 0.7) * 10 +
            Math.sin(x * 0.004 - t * 0.35 + i) * 6;
          if(x === -20) bgCtx.moveTo(x, y);
          else bgCtx.lineTo(x, y);
        }
        bgCtx.lineWidth = i % 3 === 0 ? 1.4 : 0.8;
        bgCtx.strokeStyle = i % 2 === 0
          ? "rgba(0,136,245,.10)"
          : "rgba(0,199,232,.09)";
        bgCtx.stroke();
      }

      // Những gợn sóng tròn lan tỏa rồi tan dần, xuất hiện rải rác trên trang.
      const life = 4.2;
      for(const r of ripples){
        const phase = Math.min((t - r.start) / life, 1);
        const radius = 12 + phase * 200;
        const alpha = (1 - phase) * .16;
        bgCtx.beginPath();
        bgCtx.arc(r.x, r.y, radius, 0, Math.PI * 2);
        bgCtx.lineWidth = 1;
        bgCtx.strokeStyle = `rgba(0,180,245,${alpha})`;
        bgCtx.stroke();
      }
      ripples = ripples.filter(r => (t - r.start) < life);
      if(t - lastSpawn > 1.7 && ripples.length < 5){
        ripples.push({
          x: Math.random() * w,
          y: Math.random() * h,
          start: t
        });
        lastSpawn = t;
      }

      requestAnimationFrame(drawWaves);
    }

    sizeBg();
    window.addEventListener("resize", sizeBg);

    if(!reduceMotion){
      requestAnimationFrame(drawWaves);
    }

    // ---- Parallax nhẹ cho header và lưới liên kết khi cuộn trang ----
    const headerEl = document.querySelector("header");
    const gridEl = document.getElementById("grid");
    let ticking = false;

    function applyParallax(){
      const y = window.scrollY || window.pageYOffset || 0;
      if(headerEl) headerEl.style.transform = `translateY(${(y * 0.12).toFixed(2)}px)`;
      if(gridEl) gridEl.style.transform = `translateY(${(y * -0.04).toFixed(2)}px)`;
      ticking = false;
    }

    if(!reduceMotion){
      window.addEventListener("scroll", () => {
        if(!ticking){
          requestAnimationFrame(applyParallax);
          ticking = true;
        }
      }, { passive: true });
    }
  })();
</script>
<script>
  // Đàn cá vàng đuôi xẻ ba, nhiều kích thước, bơi qua bơi lại độc lập
  (function swimmingFish(){
    const fishConfigs = [
      { id: "swimFish1", width: 75,  speed: 0.5,  bobAmp: 8,  bobSpeed: 0.022, startFrac: 0.15 },
      { id: "swimFish2", width: 44,  speed: 0.32, bobAmp: 12, bobSpeed: 0.015, startFrac: 0.6  },
      { id: "swimFish3", width: 48,  speed: 0.78, bobAmp: 6,  bobSpeed: 0.03,  startFrac: 0.85 }
    ];

    let vw = window.innerWidth;

    const fishes = fishConfigs.map(cfg => {
      const el = document.getElementById(cfg.id);
      if(!el) return null;
      return {
        el,
        width: cfg.width,
        speed: cfg.speed,
        bobAmp: cfg.bobAmp,
        bobSpeed: cfg.bobSpeed,
        x: vw * cfg.startFrac,
        direction: 1,
        t: Math.random() * 10
      };
    }).filter(Boolean);

    if(fishes.length === 0) return;

    function frame(){
      for(const f of fishes){
        f.t += f.bobSpeed;
        f.x += f.speed * f.direction;

        if(f.x >= vw - f.width){
          f.x = vw - f.width;
          f.direction = -1;
        } else if(f.x <= 0){
          f.x = 0;
          f.direction = 1;
        }

        const bob = Math.sin(f.t) * f.bobAmp; // lắc nhẹ theo chiều dọc
        f.el.style.transform = `translate(${f.x}px, calc(-50% + ${bob}px)) scaleX(${f.direction})`;
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", () => {
      vw = window.innerWidth;
      for(const f of fishes){
        f.x = Math.min(f.x, Math.max(0, vw - f.width));
      }
    });

    requestAnimationFrame(frame);
  })();
</script>
